task:
  id: content-week-01
  objective: 拆解一周内容计划，安排选题、写稿和审核，发布由负责人决定。
roles:
- id: writer
  responsibility: 撰写并修改周三用户案例
- id: reviewer
  responsibility: 协助复核事实与品牌口径
- id: manager
  responsibility: 审核修改稿并提交负责人批准
- id: human-owner
  responsibility: 决定本次发布与最终验收
workflow:
- id: draft
  owner: writer
  action: content:draft
- id: manager-review
  owner: manager
  action: content:review
- id: publish-approval
  owner: human-owner
  action: external:publish
  status: waiting
approval:
  enabled: true
  owner: human-owner
  scope: once
  status: waiting
acceptance:
  status: stale
  required_cases:
  - exaggerated-title-review
  - external-publish-policy
  - grounded-response
  - missing-rule
